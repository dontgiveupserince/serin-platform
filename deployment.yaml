apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-bot-deployment
spec:
  replicas: 1 # We only have 1 node, so 1 replica is safe
  selector:
    matchLabels:
      app: audit-bot
  template:
    metadata:
      labels:
        app: audit-bot
    spec:
      containers:
      - name: audit-bot
        # USE YOUR ACTUAL ACR SERVER NAME BELOW
        image: serinregistryxr58p9.azurecr.io/audit-bot:v1
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
