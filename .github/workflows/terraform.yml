name: 'Platform CI/CD'

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

env:
  ARM_CLIENT_ID: ${{ secrets.AZ_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZ_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZ_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZ_TENANT_ID }}

jobs:

  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform fmt -check
      - run: terraform validate
      - run: terraform plan -no-color

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform apply -auto-approve

  docker-build:
    name: 'Docker Build & Push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/audit-bot:${{ github.sha }} .
      - name: Push image (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/audit-bot:${{ github.sha }}

  deploy-to-aks:
    name: 'Deploy to AKS'
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group serin-network-rg \
            --name serin-aks-cluster \
            --overwrite-existing
      - name: Update image
        run: |
          kubectl set image deployment/audit-bot-deployment \
            audit-bot=${{ secrets.ACR_LOGIN_SERVER }}/audit-bot:${{ github.sha }}
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/audit-bot-deployment --timeout=120s
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/audit-bot-deployment
          echo "Rolled back to previous version"
